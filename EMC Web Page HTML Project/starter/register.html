<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body>
    <center>
        <h1>Error Makes Clever Academy🚀</h1>
        <h5>Training | Tech News | Freshers Guide</h5>
        <p>Empowering young developers to level up their skills through corporate training</p>
    </center>
    <hr>
    <center>
        <h1>Registration Form</h1>
        <form>
            <table>
                <tr>
                    <td>Name:</td>
                    <td><input type="text" placeholder="Enter your Name"></td>
                </tr>
                <tr>
                    <td>Age:</td>
                    <td><input type="number" placeholder="Enter your Age"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender">Male
                        <input type="radio" name="gender">Female
                        <input type="radio" name="gender">Transgender
                    </td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" placeholder="Enter your email"></td>
                </tr>
                <tr>
                    <td>Select a course:</td>
                    <td>
                        <select>
                            <option>Full stack Development</option>
                            <option>Python programming</option>
                            <option>Java programming</option>
                            <option>C++ programming</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload your Resume</td>
                    <td><input type="file" name="" id=""></td>
                </tr>
                <tr>
                    <td><input type="reset"></td>
                    <td><input type="submit"></td>
                </tr>
            </table>
        </form>
    </center>
    <hr>
    <p> 
        <center>
            <a href="index.html">Home</a>|    
            <a href="https://www.instagram.com/errormakesclever/?igshid=YmMyMTA2M2Y%3D">Instagram</a>|   
            <a href="https://youtube.com/@ErrorMakesClever?si=nfdhnpdxYTeuZn3v">Youtube</a>     
        </center>
    </p>
</body>
</html>
